# Publishes to PyPI when a GitHub release is published. No token is stored:
# PyPI trusts this workflow directly ("trusted publishing"). One-time setup on
# pypi.org → Account → Publishing → add a pending publisher with
#   project: clarity-ctl · owner/repo: this repo · workflow: publish.yml · environment: pypi
name: publish

on:
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --with pytest python -m pytest -q tests

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # what trusted publishing authenticates with
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
